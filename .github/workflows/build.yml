---
# Builds the package with the OpenWrt SDK, once per package format: the 24.10 SDK
# writes the ipk (opkg, OpenWrt 24.10 and older) and the 25.12 SDK writes the apk
# (apk-tools 3, OpenWrt 25.12 and newer). PKGARCH:=all makes each package install on
# every target, so one x86_64 SDK per format is enough. docker buildx builds
# sdk/Dockerfile on top of the pinned release SDK image and the build runs
# sdk/build-package.sh in it, against the SDK the image already holds.
#
# Pull requests and main upload both packages as workflow artifacts. On main
# semantic-release decides from the Conventional Commits since the last release
# whether a release is due. If one is, the packages are built for that version and
# the release job tags it, commits the version and the change log and publishes the
# GitHub release with both packages, which is what the sscheib.openwrt molecule
# tests install.
name: 'Build'
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - 'main'

  pull_request:
    branches:
      - 'main'

  workflow_dispatch: {}

permissions:
  contents: 'read'

concurrency:
  group: 'build-${{ github.workflow }}-${{ github.ref }}'
  # a run on main may publish a release, never cancel it half way
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

env:
  # cycjimmy/semantic-release-action installs semantic-release and the extra
  # plugins itself (it accepts no lockfile), so they are exact-version pinned
  # renovate: datasource=npm depName=semantic-release
  SEMANTIC_RELEASE_VERSION: '25.0.9'
  # renovate: datasource=npm depName=@semantic-release/changelog
  SEMANTIC_RELEASE_CHANGELOG_VERSION: '6.0.3'
  # renovate: datasource=npm depName=@semantic-release/exec
  SEMANTIC_RELEASE_EXEC_VERSION: '7.1.0'
  # renovate: datasource=npm depName=@semantic-release/git
  SEMANTIC_RELEASE_GIT_VERSION: '10.0.1'
  # the Conventional Commits preset of the analyzer and the release notes. 10.x renders
  # empty release notes with the changelog writer semantic-release 25 ships (8.4.0)
  # renovate: datasource=npm depName=conventional-changelog-conventionalcommits
  CONVENTIONALCOMMITS_VERSION: '9.1.0'

jobs:
  version:
    name: 'Determine the next release'
    if: "github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
    runs-on: 'ubuntu-24.04'
    permissions:
      # even a dry run proves it could push the release (git push --dry-run)
      contents: 'write'
    outputs:
      new-release-published: '${{ steps.semantic.outputs.new_release_published }}'
      new-release-version: '${{ steps.semantic.outputs.new_release_version }}'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1' # v2.21.1
        with:
          disable-sudo: true
          egress-policy: 'block'
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            registry.npmjs.org:443

      - name: 'Checkout the repository'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          # semantic-release needs every commit and tag since the last release
          fetch-depth: 0
          persist-credentials: false

      - name: 'Determine the next release with a semantic-release dry run'
        id: 'semantic'
        uses: 'cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90' # v6.0.0
        with:
          dry_run: true
          semantic_version: '${{ env.SEMANTIC_RELEASE_VERSION }}'
          extra_plugins: |
            @semantic-release/changelog@${{ env.SEMANTIC_RELEASE_CHANGELOG_VERSION }}
            @semantic-release/exec@${{ env.SEMANTIC_RELEASE_EXEC_VERSION }}
            @semantic-release/git@${{ env.SEMANTIC_RELEASE_GIT_VERSION }}
            conventional-changelog-conventionalcommits@${{ env.CONVENTIONALCOMMITS_VERSION }}
        env:
          GITHUB_TOKEN: '${{ github.token }}'

  metadata:
    name: 'Determine the package version to build'
    needs:
      - 'version'
    # the version job only runs on main, everywhere else the Makefile decides
    if: "!cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped')"
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: 'read'
    outputs:
      name: '${{ steps.read.outputs.name }}'
      version: '${{ steps.read.outputs.version }}'
      release: '${{ steps.read.outputs.release }}'
      release-due: '${{ steps.read.outputs.release-due }}'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1' # v2.21.1
        with:
          disable-sudo: true
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443

      - name: 'Checkout the repository'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false

      - name: 'Read the Makefile and apply the next release'
        id: 'read'
        shell: 'bash'
        env:
          MAKEFILE: './openwrt-molecule-package/Makefile'
          RELEASE_DUE: '${{ needs.version.outputs.new-release-published }}'
          NEXT_VERSION: '${{ needs.version.outputs.new-release-version }}'
        run: |
          # fail if:
          # - a variable is unbound
          # - any command fails
          # - a command in a pipe fails
          # - a command in a sub-shell fails
          set -Eeuo pipefail

          # enable debug if runner runs in debug
          [[ "${{ runner.debug }}" != '1' ]] || {
            echo "INFO: Enabling bash trace";
            set -x;
          };

          # only the SDK can evaluate the Makefile, so the three assignments are read
          # literally and must be assigned exactly once to a plain value
          readVariable() {
            local -a values
            mapfile -t values < <(sed -nE "s/^${1}:=(.*)$/\1/p" "${MAKEFILE}")
            [[ "${#values[@]}" -eq 1 && "${values[0]}" =~ ^[A-Za-z0-9._+-]+$ ]] || {
              echo "ERROR: ${MAKEFILE} must assign ${1} exactly once to a plain value" >&2;
              return 1;
            };
            echo "${values[0]}"
          }

          name="$(readVariable 'PKG_NAME')"
          version="$(readVariable 'PKG_VERSION')"
          release="$(readVariable 'PKG_RELEASE')"

          # a due release builds the version semantic-release will tag, as release 1
          if [[ "${RELEASE_DUE}" == 'true' ]]; then
            [[ "${NEXT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "ERROR: semantic-release computed '${NEXT_VERSION}', not a plain X.Y.Z version";
              exit 1;
            };
            version="${NEXT_VERSION}"
            release='1'
            echo "INFO: release ${version} is due"
          else
            RELEASE_DUE='false'
            echo "INFO: no release is due, building the Makefile's version"
          fi

          echo "INFO: ${name} ${version}-r${release}"
          {
            echo "name=${name}"
            echo "version=${version}"
            echo "release=${release}"
            echo "release-due=${RELEASE_DUE}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: 'Build the ${{ matrix.format }} with the OpenWrt ${{ matrix.openwrt }} SDK'
    needs:
      - 'metadata'
    # the implicit success() would also skip the build when the version job was
    # skipped, as it is on every pull request
    if: "!cancelled() && needs.metadata.result == 'success'"
    runs-on: 'ubuntu-24.04'
    # MEASURED: one SDK builds the package in about 2 minutes, pulling the SDK image
    # takes a few more. The cap ends a hung build long before the six-hour default
    timeout-minutes: 20
    permissions:
      contents: 'read'
    strategy:
      fail-fast: false
      matrix:
        include:
          # the SDK image sdk/Dockerfile builds FROM, the digest pins it exactly
          - openwrt: '24.10'
            format: 'ipk'
            # renovate: datasource=docker
            sdk: 'ghcr.io/openwrt/sdk:x86_64-24.10.8@sha256:b28d5e4087dbd3f815a8bf5440a11e54e6bbd3d7400c3729d872e7940a4a77c1'  # yamllint disable-line rule:line-length

          - openwrt: '25.12'
            format: 'apk'
            # renovate: datasource=docker
            sdk: 'ghcr.io/openwrt/sdk:x86_64-25.12.5@sha256:e916b7cc555890bdc4725c926e139b888294f0c8f56561b88d8da3a6348616a2'  # yamllint disable-line rule:line-length

    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1' # v2.21.1
        with:
          disable-sudo: true
          egress-policy: 'block'
          # GitHub: the checkout and the build summary
          # ghcr.io: the SDK image
          # Docker Hub: the moby/buildkit image of the docker-container driver
          # GitHub Actions services: the gha build cache, the build record and the
          #   package artifact
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443

      - name: 'Checkout the repository'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false

      - name: 'Set up Docker Buildx'
        uses: 'docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069' # v4.4.1

      - name: 'Build the SDK image'
        uses: 'docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc' # v7.4.0
        with:
          context: './sdk'
          build-args: |
            SDK_IMAGE=${{ matrix.sdk }}
          tags: 'openwrt-molecule-package-sdk:${{ matrix.openwrt }}'
          # the next step runs the image from the local docker daemon
          load: true
          push: false
          cache-from: 'type=gha,scope=sdk-${{ matrix.openwrt }}'
          cache-to: 'type=gha,scope=sdk-${{ matrix.openwrt }}'

      - name: 'Write the version to build into the Makefile'
        shell: 'bash'
        env:
          MAKEFILE: './openwrt-molecule-package/Makefile'
          VERSION: '${{ needs.metadata.outputs.version }}'
          RELEASE: '${{ needs.metadata.outputs.release }}'
        run: |
          # fail if:
          # - a variable is unbound
          # - any command fails
          # - a command in a pipe fails
          # - a command in a sub-shell fails
          set -Eeuo pipefail

          # enable debug if runner runs in debug
          [[ "${{ runner.debug }}" != '1' ]] || {
            echo "INFO: Enabling bash trace";
            set -x;
          };

          # the same edit the exec plugin of release.config.js makes in the release
          # commit, so a released package carries the version of its release. Without
          # a release due this rewrites the Makefile's own values
          sed -i -E \
            -e "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" \
            -e "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${RELEASE}/" \
            "${MAKEFILE}"

          if ! grep -qxF "PKG_VERSION:=${VERSION}" "${MAKEFILE}" \
            || ! grep -qxF "PKG_RELEASE:=${RELEASE}" "${MAKEFILE}"; then
            echo "ERROR: ${MAKEFILE} does not carry ${VERSION}-r${RELEASE} after the edit";
            exit 1;
          fi

      - name: 'Build the package with the OpenWrt SDK'
        shell: 'bash'
        env:
          # the tag the previous step loaded into the local daemon, never pulled
          LOCAL_TAG: 'openwrt-molecule-package-sdk:${{ matrix.openwrt }}'
          PACKAGE: '${{ needs.metadata.outputs.name }}'
          OUT_DIR: '${{ runner.temp }}/packages'
          VERBOSITY: "${{ runner.debug == '1' && 's' || '' }}"
        run: |
          # fail if:
          # - a variable is unbound
          # - any command fails
          # - a command in a pipe fails
          # - a command in a sub-shell fails
          set -Eeuo pipefail

          # enable debug if runner runs in debug
          [[ "${{ runner.debug }}" != '1' ]] || {
            echo "INFO: Enabling bash trace";
            set -x;
          };

          # the SDK runs as the image's user buildbot, whose uid has no write access
          # to the runner's directories. A sticky world-writable output directory
          # takes its files whatever that uid is, the runner can read them back
          # and the feed only needs to be readable, so it is mounted read-only
          mkdir -p "${OUT_DIR}"
          chmod 1777 "${OUT_DIR}"

          # the package has no source to download, so the build needs no network
          docker run --rm \
            --network none \
            --volume "${GITHUB_WORKSPACE}/${PACKAGE}:/feed/${PACKAGE}:ro" \
            --volume "${OUT_DIR}:/out" \
            --env "V=${VERBOSITY}" \
            "${LOCAL_TAG}" \
            "${PACKAGE}"

      - name: 'Check the package and stage it for upload'
        id: 'package'
        shell: 'bash'
        env:
          FORMAT: '${{ matrix.format }}'
          NAME: '${{ needs.metadata.outputs.name }}'
          VERSION: '${{ needs.metadata.outputs.version }}'
          RELEASE: '${{ needs.metadata.outputs.release }}'
          OUT_DIR: '${{ runner.temp }}/packages'
        run: |
          # fail if:
          # - a variable is unbound
          # - any command fails
          # - a command in a pipe fails
          # - a command in a sub-shell fails
          set -Eeuo pipefail

          # enable debug if runner runs in debug
          [[ "${{ runner.debug }}" != '1' ]] || {
            echo "INFO: Enabling bash trace";
            set -x;
          };

          # the file names include/package-pack.mk gives a PKGARCH:=all package
          case "${FORMAT}" in
            'ipk') expected="${NAME}_${VERSION}-r${RELEASE}_all.ipk" ;;
            'apk') expected="${NAME}-${VERSION}-r${RELEASE}.apk" ;;
            *) echo "ERROR: unknown package format '${FORMAT}'"; exit 1 ;;
          esac

          # build-package copies every package file the SDK wrote into OUT_DIR
          mapfile -t built < <(find "${OUT_DIR}" -type f -name "${expected}")
          [[ "${#built[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one ${expected}, found ${#built[@]}, the SDK wrote:";
            find "${OUT_DIR}" -type f || true;
            exit 1;
          };

          # an ipk is a gzipped tar, so prove it is architecture independent and
          # ships the marker. An apk is an ADB file that needs apk-tools 3 to read
          if [[ "${FORMAT}" == 'ipk' ]]; then
            unpacked="$(mktemp -d)"
            tar -xzf "${built[0]}" -C "${unpacked}"
            mkdir "${unpacked}/control"
            tar -xzf "${unpacked}/control.tar.gz" -C "${unpacked}/control"
            grep -qxF 'Architecture: all' "${unpacked}/control/control" || {
              echo "ERROR: ${expected} is not 'Architecture: all'";
              exit 1;
            };
            # listed first, grep -q closing a live pipe would fail it under pipefail
            contents="$(tar -tzf "${unpacked}/data.tar.gz")"
            grep -qxE "(\./)?usr/share/${NAME}/marker" <<< "${contents}" || {
              echo "ERROR: ${expected} does not ship /usr/share/${NAME}/marker";
              exit 1;
            };
          fi

          mkdir -p dist
          cp "${built[0]}" "dist/${expected}"
          echo "INFO: built ${expected}"

      - name: 'Upload the package'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          name: 'package-${{ matrix.format }}'
          path: 'dist/'
          if-no-files-found: 'error'

  release:
    name: 'Publish the release'
    needs:
      - 'metadata'
      - 'build'
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.metadata.outputs.release-due == 'true'
    runs-on: 'ubuntu-24.04'
    permissions:
      # push the release commit and tag and create the release with its assets
      contents: 'write'
      # the github plugin comments on the issues and pull requests a release
      # resolves and opens an issue when a release fails
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1' # v2.21.1
        with:
          disable-sudo: true
          egress-policy: 'block'
          # npm for semantic-release, GitHub for the push and the release, the
          # artifact service and its blob storage for the packages
          allowed-endpoints: >
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443
            uploads.github.com:443

      - name: 'Checkout the repository'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          # semantic-release needs every commit and tag since the last release
          fetch-depth: 0
          persist-credentials: false

      - name: 'Download the packages'
        uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333' # v8.0.2
        with:
          pattern: 'package-*'
          path: 'dist/'
          merge-multiple: true

      - name: 'Check that exactly the two packages of this release are attached'
        shell: 'bash'
        env:
          NAME: '${{ needs.metadata.outputs.name }}'
          VERSION: '${{ needs.metadata.outputs.version }}'
          RELEASE: '${{ needs.metadata.outputs.release }}'
        run: |
          # fail if:
          # - a variable is unbound
          # - any command fails
          # - a command in a pipe fails
          # - a command in a sub-shell fails
          set -Eeuo pipefail

          # enable debug if runner runs in debug
          [[ "${{ runner.debug }}" != '1' ]] || {
            echo "INFO: Enabling bash trace";
            set -x;
          };

          # the github plugin globs dist/, so dist/ must hold these two files only
          expected="$(printf '%s\n' \
            "${NAME}-${VERSION}-r${RELEASE}.apk" \
            "${NAME}_${VERSION}-r${RELEASE}_all.ipk" | sort)"
          found="$(find dist -mindepth 1 -printf '%P\n' | sort)"
          [[ "${found}" == "${expected}" ]] || {
            echo "ERROR: dist/ holds"
            echo "${found}"
            echo "ERROR: expected exactly"
            echo "${expected}"
            exit 1;
          };

          echo "INFO: attaching ${expected//$'\n'/ and }"

      - name: 'Create the release'
        id: 'semantic'
        uses: 'cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90' # v6.0.0
        with:
          semantic_version: '${{ env.SEMANTIC_RELEASE_VERSION }}'
          extra_plugins: |
            @semantic-release/changelog@${{ env.SEMANTIC_RELEASE_CHANGELOG_VERSION }}
            @semantic-release/exec@${{ env.SEMANTIC_RELEASE_EXEC_VERSION }}
            @semantic-release/git@${{ env.SEMANTIC_RELEASE_GIT_VERSION }}
            conventional-changelog-conventionalcommits@${{ env.CONVENTIONALCOMMITS_VERSION }}
        env:
          # a push made with GITHUB_TOKEN starts no workflow, so the release commit
          # does not run CI or this workflow again
          GITHUB_TOKEN: '${{ github.token }}'

      - name: 'Check the release has the version the packages were built for'
        shell: 'bash'
        env:
          PUBLISHED: '${{ steps.semantic.outputs.new_release_published }}'
          RELEASED: '${{ steps.semantic.outputs.new_release_version }}'
          VERSION: '${{ needs.metadata.outputs.version }}'
        run: |
          # fail if:
          # - a variable is unbound
          # - any command fails
          # - a command in a pipe fails
          # - a command in a sub-shell fails
          set -Eeuo pipefail

          # enable debug if runner runs in debug
          [[ "${{ runner.debug }}" != '1' ]] || {
            echo "INFO: Enabling bash trace";
            set -x;
          };

          # semantic-release publishes nothing when main moved on since this run
          # started. The run of the newer commit releases instead
          [[ "${PUBLISHED}" == 'true' ]] || {
            echo "WARNING: no release published, main moved on since this run started";
            exit 0;
          };

          # the dry run and this run analyse the same commits and tags, so a
          # different version means the attached packages carry the wrong one
          [[ "${RELEASED}" == "${VERSION}" ]] || {
            echo "ERROR: released ${RELEASED}, but the attached packages are ${VERSION}";
            exit 1;
          };

          echo "INFO: released ${RELEASED}"
...
