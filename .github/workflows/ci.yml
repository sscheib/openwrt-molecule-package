---
# Lint and commit validation. The jobs are copies of the shared sscheib reusable
# workflows (one job per tool, prek as the last-resort job for the residual
# pre-commit hooks, commitlint and the pin-gate): those live in a private
# repository, which a public repository cannot call.
name: 'CI'
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - 'main'

  pull_request:
    branches:
      - 'main'

  workflow_dispatch: {}

permissions:
  contents: 'read'

concurrency:
  group: 'ci-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

env:
  # renovate: datasource=node-version depName=node
  NODE_VERSION: '24.22.1'

jobs:
  actionlint:
    name: 'actionlint'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: 'read'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          disable-sudo: true
          egress-policy: 'block'
          allowed-endpoints: >
            auth.docker.io:443
            github.com:443
            index.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443

      - name: 'Checkout the repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false

      - name: 'Run actionlint'
        shell: 'bash'
        env:
          # renovate: datasource=docker
          ACTIONLINT_IMAGE: 'docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667'  # yamllint disable-line rule:line-length
        run: |
          # fail if:
          # - a variable is unbound
          # - any command fails
          # - a command in a pipe fails
          # - a command in a sub-shell fails
          set -Eeuo pipefail

          # enable debug if runner runs in debug
          [[ "${{ runner.debug }}" != '1' ]] || {
            echo "INFO: Enabling bash trace";
            set -x;
          };

          docker run --rm -v "${PWD}:/repo" -w /repo "${ACTIONLINT_IMAGE}" -color

  yamllint:
    name: 'yamllint'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: 'read'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          disable-sudo: true
          egress-policy: 'block'
          allowed-endpoints: >
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443

      - name: 'Checkout the repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install uv'
        uses: 'astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e' # v10.3.2
        with:
          # the tool comes from a pinned uvx call; with nothing to key a cache on, the
          # default cache only warns that no requirements file matched
          enable-cache: false

      - name: 'Run yamllint'
        shell: 'bash'
        run: |
          # fail if:
          # - a variable is unbound
          # - any command fails
          # - a command in a pipe fails
          # - a command in a sub-shell fails
          set -Eeuo pipefail

          # enable debug if runner runs in debug
          [[ "${{ runner.debug }}" != '1' ]] || {
            echo "INFO: Enabling bash trace";
            set -x;
          };

          # reusable-owned tool version (Renovate-maintained; version-pinned, the
          # documented lint-tool exception to the requirements hash-lock)
          # renovate: datasource=pypi depName=yamllint
          uv tool run --from 'yamllint==1.38.0' yamllint .

  markdownlint:
    name: 'markdownlint'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: 'read'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          disable-sudo: true
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            registry.npmjs.org:443

      - name: 'Checkout the repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false

      - name: 'Run markdownlint'
        uses: 'DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff' # v24.2.0
        with:
          globs: '**/*.md'

  check-github-workflows:
    name: 'check-github-workflows'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: 'read'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          disable-sudo: true
          egress-policy: 'block'
          allowed-endpoints: >
            files.pythonhosted.org:443
            github.com:443
            json.schemastore.org:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443

      - name: 'Checkout the repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install uv'
        uses: 'astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e' # v10.3.2
        with:
          # the tool comes from a pinned uvx call; with nothing to key a cache on, the
          # default cache only warns that no requirements file matched
          enable-cache: false

      - name: 'Validate the workflow files against the GitHub Actions schema'
        shell: 'bash'
        env:
          CHECK_TARGET: '.github/workflows/*.yml'
        run: |
          # fail if:
          # - a variable is unbound
          # - any command fails
          # - a command in a pipe fails
          # - a command in a sub-shell fails
          set -Eeuo pipefail

          # enable debug if runner runs in debug
          [[ "${{ runner.debug }}" != '1' ]] || {
            echo "INFO: Enabling bash trace";
            set -x;
          };

          # expand the target glob into an array (avoids unquoted word-splitting)
          mapfile -t __targets < <(compgen -G "${CHECK_TARGET}" || true)
          [[ "${#__targets[@]}" -ne 0 ]] || {
            echo "INFO: no files match '${CHECK_TARGET}', nothing to validate";
            exit 0;
          };

          # reusable-owned tool version (Renovate-maintained)
          # renovate: datasource=pypi depName=check-jsonschema
          uv tool run --from 'check-jsonschema==0.38.2' \
            check-jsonschema --builtin-schema vendor.github-workflows "${__targets[@]}"

  renovate-config-validator:
    name: 'renovate-config-validator'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: 'read'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          disable-sudo: true
          egress-policy: 'block'
          allowed-endpoints: >
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443

      - name: 'Checkout the repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false

      - name: 'Validate the Renovate configuration'
        shell: 'bash'
        env:
          # renovate: datasource=docker
          RENOVATE_IMAGE: 'ghcr.io/renovatebot/renovate:44.167.5@sha256:c33150ec6407624a9399a2d827fd125becafdbe4519d7584488cbdd17f99081e'  # yamllint disable-line rule:line-length
        run: |
          # fail if:
          # - a variable is unbound
          # - any command fails
          # - a command in a pipe fails
          # - a command in a sub-shell fails
          set -Eeuo pipefail

          # enable debug if runner runs in debug
          [[ "${{ runner.debug }}" != '1' ]] || {
            echo "INFO: Enabling bash trace";
            set -x;
          };

          docker run --rm -v "${PWD}:/mnt" -w /mnt "${RENOVATE_IMAGE}" \
            renovate-config-validator --strict || {
              echo "ERROR: Renovate configuration check failed, failing workflow!";
              exit 1;
          };

  gitleaks:
    name: 'gitleaks'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: 'read'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          disable-sudo: true
          egress-policy: 'block'
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: 'Checkout the repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Run gitleaks'
        uses: 'gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e' # v3.0.0
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

  zizmor:
    name: 'zizmor'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: 'read'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          disable-sudo: true
          egress-policy: 'block'
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443

      - name: 'Checkout the repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false

      - name: 'Run zizmor'
        uses: 'zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e' # v0.7.1
        with:
          # fail the job on any finding; do not upload SARIF (no advanced security)
          advanced-security: false
          min-severity: 'low'
          persona: 'regular'

  eslint:
    name: 'eslint'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: 'read'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          disable-sudo: true
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            nodejs.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: 'Checkout the repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install NodeJS'
        uses: 'actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1' # v7.1.0
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: 'Run eslint'
        shell: 'bash'
        run: |
          # fail if:
          # - a variable is unbound
          # - any command fails
          # - a command in a pipe fails
          # - a command in a sub-shell fails
          set -Eeuo pipefail

          # enable debug if runner runs in debug
          [[ "${{ runner.debug }}" != '1' ]] || {
            echo "INFO: Enabling bash trace";
            set -x;
          };

          # collect the JavaScript, JSON and JSON5 files, excluding node_modules and lock files
          mapfile -d '' __files < <(
            find . -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' -o -name '*.json' -o -name '*.json5' \) \
              -not -path './node_modules/*' -not -path './.git/*' -not -name 'package-lock.json' -print0
          )

          [[ "${#__files[@]}" -ne 0 ]] || {
            echo "INFO: no JavaScript or JSON files found, nothing to lint";
            exit 0;
          };

          [[ -f 'eslint.config.mjs' ]] || {
            echo "ERROR: eslint.config.mjs is missing: copy it from sscheib/workflows-shared-config config/";
            exit 1;
          };

          # eslint and its plugins are devDependencies of the caller, installed hash-locked from
          # its committed package-lock.json (the npm hash-lock policy) rather than ad hoc
          grep -q '"eslint"' package.json || {
            echo "ERROR: package.json lacks the eslint devDependencies (eslint, @eslint/js, @eslint/json, globals)";
            exit 1;
          };
          npm ci

          npx --no-install eslint --max-warnings=0 --no-warn-ignored "${__files[@]}"

  hadolint:
    name: 'hadolint'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: 'read'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          disable-sudo: true
          egress-policy: 'block'
          # the action is a container action built FROM a ghcr.io hadolint image
          allowed-endpoints: >
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443

      - name: 'Checkout the repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false

      - name: 'Run hadolint'
        uses: 'hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387' # v3.5.0
        with:
          dockerfile: 'sdk/Dockerfile'

  prek:
    name: 'prek (residual hooks)'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: 'read'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          egress-policy: 'audit'

      - name: 'Checkout the repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false

      - name: 'Skip the hooks a dedicated job already runs'
        shell: 'bash'
        run: |
          # fail if:
          # - a variable is unbound
          # - any command fails
          # - a command in a pipe fails
          # - a command in a sub-shell fails
          set -Eeuo pipefail

          # enable debug if runner runs in debug
          [[ "${{ runner.debug }}" != '1' ]] || {
            echo "INFO: Enabling bash trace";
            set -x;
          };

          # hooks already covered by a dedicated job above; prek only runs the residual
          coveredHooks="actionlint,yamllint,markdownlint-cli2,check-github-workflows"
          coveredHooks="${coveredHooks},renovate-config-validator,gitleaks,zizmor,eslint,commitlint"
          coveredHooks="${coveredHooks},hadolint-docker"
          declare -r coveredHooks

          echo "SKIP=${coveredHooks}" >> "${GITHUB_ENV}"

      - name: 'Run prek'
        # prek-action installs prek, caches the hook environments and runs
        # `prek run --show-diff-on-failure --color=always --all-files`
        uses: 'j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d' # v3.1.0

  commitlint:
    name: 'commitlint'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: 'read'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            nodejs.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: 'Checkout the repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Install NodeJS'
        uses: 'actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1' # v7.1.0
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: 'Install commitlint (hash-locked via npm ci)'
        shell: 'bash'
        run: |
          # fail if:
          # - a variable is unbound
          # - any command fails
          # - a command in a pipe fails
          # - a command in a sub-shell fails
          set -Eeuo pipefail

          # enable debug if runner runs in debug
          [[ "${{ runner.debug }}" != '1' ]] || {
            echo "INFO: Enabling bash trace";
            set -x;
          };

          # npm ci installs the exact tree from the committed package-lock.json,
          # verifying every integrity hash
          npm ci

      - name: 'Validate current commit (last commit) with commitlint'
        if: "github.event_name != 'pull_request'"
        shell: 'bash'
        run: |
          # fail if:
          # - a variable is unbound
          # - any command fails
          # - a command in a pipe fails
          # - a command in a sub-shell fails
          set -Eeuo pipefail

          # enable debug if runner runs in debug
          [[ "${{ runner.debug }}" != '1' ]] || {
            echo "INFO: Enabling bash trace";
            set -x;
          };

          npx commitlint --last --verbose

      - name: 'Validate pull request commits with commitlint'
        if: "github.event_name == 'pull_request'"
        shell: 'bash'
        env:
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
          COMMITS: '${{ github.event.pull_request.commits }}'
        run: |
          # fail if:
          # - a variable is unbound
          # - any command fails
          # - a command in a pipe fails
          # - a command in a sub-shell fails
          set -Eeuo pipefail

          # enable debug if runner runs in debug
          [[ "${{ runner.debug }}" != '1' ]] || {
            echo "INFO: Enabling bash trace";
            set -x;
          };

          npx commitlint --from "${HEAD_SHA}~${COMMITS}" --to "${HEAD_SHA}" --verbose

  pin-gate:
    name: 'pin-gate (digest/hash enforcement)'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: 'read'
    steps:
      - name: 'Harden Runner'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          disable-sudo: true
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443

      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false

      - name: 'Fail on any unpinned action or floating container image'
        shell: 'bash'
        run: |
          # fail if:
          # - a variable is unbound
          # - any command fails
          # - a command in a pipe fails
          # - a command in a sub-shell fails
          set -Eeuo pipefail

          # enable debug if runner runs in debug
          [[ "${{ runner.debug }}" != '1' ]] || {
            echo "INFO: Enabling bash trace";
            set -x;
          };

          declare -i violations=0

          # every `uses:` must reference a 40-char commit SHA, unless it is a
          # local reference (starts with ./)
          while IFS= read -r line; do
            ref="${line#*uses:}"
            # drop any trailing ' # vX.Y' version comment before stripping spaces
            ref="${ref%%#*}"
            ref="$(echo "${ref}" | tr -d " '\"")"
            # allow local reusable/composite references
            [[ "${ref}" == ./* ]] && continue
            # everything else must be pinned to a 40-hex SHA
            [[ "${ref}" =~ @[0-9a-f]{40}$ ]] || {
              echo "ERROR: unpinned 'uses': ${ref}";
              violations+=1;
            };
          done < <(grep -rhnE "^\s*(-\s*)?uses:\s*" .github/ 2>/dev/null | sed -E 's/^[^:]+:[0-9]+://')

          # no container image may float on a bare tag: every *image* / *IMAGE* key and
          # every SDK image tag the build matrix passes as ARCH must carry a digest
          while IFS= read -r match; do
            echo "ERROR: floating container image (missing @sha256): ${match}";
            violations+=1;
          done < <(grep -rhnE "^\s*(-\s*)?[A-Za-z_-]*(image|IMAGE|sdk):\s*['\"]" .github/ 2>/dev/null \
            | grep -vE "@sha256:[0-9a-f]{64}['\"]" || true)

          [[ "${violations}" -eq 0 ]] || {
            echo "ERROR: ${violations} pin violation(s) found";
            exit 1;
          };

          echo "INFO: all actions SHA-pinned, no floating container images"
...
